<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ajustar stock</title>
    <style>
        body { font-family: system-ui, sans-serif; margin: 0; padding: 1rem; max-width: 800px; margin-inline: auto; }
        .tabla { overflow-x: auto; }
        table { border-collapse: collapse; width: 100%; }
        th, td { border-bottom: 1px solid #ddd; padding: .5rem; text-align: left; white-space: nowrap; }
        .ok { background: #e6f4ea; padding: .5rem 1rem; border-radius: 6px; }
        .error { background: #fdecea; color: #b00020; padding: .5rem 1rem; border-radius: 6px; }
        .stock { font-size: 2rem; font-weight: bold; }
        .ajuste { display: grid; gap: .5rem; max-width: 360px; margin: 1rem 0; }
        input, select { padding: .5rem; box-sizing: border-box; }
        .mas { color: #137333; } .menos { color: #b00020; }
    </style>
</head>
<body>
<h1>Ajustar stock</h1>
<p>
    <strong th:text="${variante.producto.nombre}">Producto</strong> ·
    talle <span th:text="${variante.talle}">M</span>
    <span th:unless="${variante.color.isBlank()}" th:text="'· ' + ${variante.color}"></span>
</p>
<p><a th:href="@{/admin/productos/{id}/variantes(id=${variante.producto.id})}">← Variantes</a></p>
<p class="ok" th:if="${mensaje}" th:text="${mensaje}"></p>
<p class="error" th:if="${error}" th:text="${error}"></p>

<p>Stock actual: <span class="stock" th:text="${variante.stock}">0</span></p>

<form class="ajuste" th:action="@{/admin/variantes/{id}/ajustar(id=${variante.id})}" method="post">
    <select name="operacion">
        <option value="SUMAR">Sumar unidades</option>
        <option value="RESTAR">Restar unidades</option>
    </select>
    <input type="number" name="cantidad" min="1" placeholder="Cantidad" required>
    <input type="text" name="motivo" list="motivos" maxlength="200" placeholder="Motivo (obligatorio)" required>
    <datalist id="motivos">
        <option value="Reposición de mercadería">
        <option value="Venta en el local">
        <option value="Prenda dañada">
        <option value="Corrección de inventario">
    </datalist>
    <button type="submit">Guardar ajuste</button>
</form>

<h3>Historial</h3>
<p th:if="${movimientos.empty}">Todavía no hay movimientos.</p>
<div class="tabla" th:unless="${movimientos.empty}">
    <table>
        <thead><tr><th>Fecha</th><th>Tipo</th><th>Cant.</th><th>Stock</th><th>Motivo</th><th>Usuario</th><th>Pedido</th></tr></thead>
        <tbody>
        <tr th:each="m : ${movimientos}">
            <td th:text="${#temporals.format(m.fecha, 'dd/MM/yyyy HH:mm')}">fecha</td>
            <td th:text="${m.tipo}">tipo</td>
            <td th:text="${m.cantidad > 0 ? '+' + m.cantidad : m.cantidad}"
                th:classappend="${m.cantidad > 0} ? 'mas' : 'menos'">+1</td>
            <td th:text="${m.stockResultante}">0</td>
            <td th:text="${m.motivo}">motivo</td>
            <td th:text="${m.usuario}">usuario</td>
            <td th:text="${m.pedidoId != null} ? '#' + ${m.pedidoId} : '—'">—</td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
