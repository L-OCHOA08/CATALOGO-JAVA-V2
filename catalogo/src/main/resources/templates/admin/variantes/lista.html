<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Variantes</title>
    <style>
        body { font-family: system-ui, sans-serif; margin: 0; padding: 1rem; max-width: 800px; margin-inline: auto; }
        .tabla { overflow-x: auto; }
        table { border-collapse: collapse; width: 100%; }
        th, td { border-bottom: 1px solid #ddd; padding: .5rem; text-align: left; }
        .inactiva { color: #888; }
        .ok { background: #e6f4ea; padding: .5rem 1rem; border-radius: 6px; }
        .error { background: #fdecea; color: #b00020; padding: .5rem 1rem; border-radius: 6px; }
        form.inline { display: inline; }
        .nueva { display: grid; gap: .5rem; max-width: 360px; margin-top: 1rem; }
        input { padding: .5rem; box-sizing: border-box; }
    </style>
</head>
<body>
<h1>Variantes</h1>
<h2 th:text="${producto.nombre}">Producto</h2>
<p><a th:href="@{/admin/productos}">← Productos</a></p>
<p class="ok" th:if="${mensaje}" th:text="${mensaje}"></p>
<p class="error" th:if="${error}" th:text="${error}"></p>

<div class="tabla">
    <table>
        <thead><tr><th>Talle</th><th>Color</th><th>Stock</th><th>Estado</th><th>Acciones</th></tr></thead>
        <tbody>
        <tr th:each="v : ${variantes}" th:classappend="${!v.activo} ? 'inactiva'">
            <td th:text="${v.talle}">M</td>
            <td th:text="${v.color.isBlank()} ? '—' : ${v.color}">Negro</td>
            <td><strong th:text="${v.stock}">0</strong></td>
            <td th:text="${v.activo} ? 'Activa' : 'Oculta'">Activa</td>
            <td>
                <a th:href="@{/admin/variantes/{id}(id=${v.id})}">Ajustar / historial</a>
                <form class="inline" th:action="@{/admin/variantes/{id}/activar(id=${v.id})}" method="post">
                    <button type="submit" th:text="${v.activo} ? 'Ocultar' : 'Activar'">Ocultar</button>
                </form>
                <form class="inline" th:action="@{/admin/variantes/{id}/eliminar(id=${v.id})}" method="post"
                      onsubmit="return confirm('¿Eliminar esta variante?');">
                    <button type="submit">Eliminar</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>

<h3>Agregar variante</h3>
<form class="nueva" th:action="@{/admin/productos/{id}/variantes(id=${producto.id})}" method="post">
    <input type="text" name="talle" placeholder="Talle (ej. M, 42)" maxlength="20" required>
    <input type="text" name="color" placeholder="Color (opcional)" maxlength="40">
    <input type="number" name="stockInicial" placeholder="Stock inicial" min="0" value="0">
    <button type="submit">Agregar</button>
</form>
</body>
</html>
