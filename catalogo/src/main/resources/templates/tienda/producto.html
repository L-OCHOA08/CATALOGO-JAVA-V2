<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${producto.nombre}">Producto</title>
    <link rel="stylesheet" th:href="@{/css/tienda.css}">
</head>
<body>
<div th:replace="~{fragments/cabecera :: cabecera}"></div>
<p class="error" th:if="${error}" th:text="${error}"></p>

<div class="detalle">
    <img th:if="${producto.imagen}" th:src="@{/uploads/{f}(f=${producto.imagen})}" th:alt="${producto.nombre}">
    <h1 th:text="${producto.nombre}">Nombre</h1>
    <p th:text="${producto.descripcion}">Descripción</p>
    <p class="precio" th:text="'$ ' + ${#numbers.formatDecimal(producto.precio, 1, 'POINT', 2, 'COMMA')}">$ 0</p>

    <form th:action="@{/carrito/agregar}" method="post" th:unless="${variantes.empty}">
        <label for="varianteId">Talle / color</label>
        <select id="varianteId" name="varianteId" required>
            <option th:each="v : ${variantes}" th:value="${v.id}"
                    th:text="${v.talle + (v.color.isBlank() ? '' : ' · ' + v.color) + (v.stock <= 3 ? ' (quedan ' + v.stock + ')' : '')}">M</option>
        </select>
        <label for="cantidad">Cantidad</label>
        <input type="number" id="cantidad" name="cantidad" min="1" max="10" value="1">
        <p><button class="btn" type="submit">Agregar al carrito</button></p>
    </form>

    <p class="agotado" th:if="${variantes.empty}">Agotado por el momento</p>
    <p><a th:href="@{/}">← Seguir viendo</a></p>
</div>
</body>
</html>
