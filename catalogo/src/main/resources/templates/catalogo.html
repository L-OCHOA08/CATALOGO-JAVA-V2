<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Catálogo</title>
    <link rel="stylesheet" th:href="@{/css/tienda.css}">
</head>
<body>
<div th:replace="~{fragments/cabecera :: cabecera}"></div>
<p class="ok" th:if="${mensaje}" th:text="${mensaje}"></p>
<p class="error" th:if="${error}" th:text="${error}"></p>

<nav>
    <a th:href="@{/}">Todos</a>
    <a th:each="c : ${categorias}" th:href="@{/categoria/{s}(s=${c.slug})}" th:text="${c.nombre}">Cat</a>
</nav>

<p th:if="${productos.empty}">No hay productos para mostrar.</p>

<div class="grid">
    <div class="card" th:each="p : ${productos.content}">
        <img th:if="${p.imagen}" th:src="@{/uploads/{f}(f=${p.imagen})}" th:alt="${p.nombre}">
        <h3 th:text="${p.nombre}">Nombre</h3>
        <p class="precio" th:text="'$ ' + ${#numbers.formatDecimal(p.precio, 1, 'POINT', 2, 'COMMA')}">$ 0</p>

        <p class="agotado" th:if="${modulos.stock and (stockPorProducto[p.id] ?: 0) == 0}">Agotado</p>

        <a class="btn" th:if="${modulos.tienda}" th:href="@{/producto/{id}(id=${p.id})}"
           th:text="${(stockPorProducto[p.id] ?: 0) == 0} ? 'Ver detalle' : 'Ver talles y comprar'">Ver</a>

        <a class="btn" th:unless="${modulos.tienda or #strings.isEmpty(whatsappNumero)}"
           target="_blank" rel="noopener"
           th:href="'https://wa.me/' + ${whatsappNumero} + '?text=' + ${#uris.escapeQueryParam('Hola! Me interesa: ' + p.nombre)}">Consultar por WhatsApp</a>
    </div>
</div>
</body>
</html>
